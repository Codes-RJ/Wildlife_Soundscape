project: Wildlife Soundscape Mapping & Behavior Analysis System
branch: research-upgrades

hard_constraints:
  protocol_version: 4
  firmware_changes: false
  hardware_changes: false
  localization_dimension: 2D
  node_count: 3
  sample_rate_hz: 48000
  tdoa_sign: "B-A = (distance_B - distance_A) / c"
  gpio27_role: "session/start marker only"
  shared_clock: "Node1 BCLK/WS"

phases:
  - id: P0
    name: baseline
    required: true
  - id: P1
    name: birdnet_taxonomy_and_geo_context
    required: true
  - id: P2
    name: ecoacoustic_indices
    required: true
  - id: P3
    name: gcc_phat_research_mode
    required: true
  - id: P4
    name: geojson_export
    required: true
  - id: P5
    name: database_dashboard_integration
    required: true
  - id: P6
    name: tests_and_docs
    required: true
  - id: P7
    name: birdnet_embeddings_clustering
    required: false

forbidden_scope:
  - microSD_backfill
  - battery_telemetry
  - solar
  - LoRa
  - GPS_per_node
  - fourth_node
  - 3D_localization
  - target_species_webhooks
  - protocol_v5

name: Python quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NUMBA_CACHE_DIR: ${{ runner.temp }}/wildlife-soundscape-numba-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          analytics calibration classification dashboard dsp localization tools
          config.py database.py environment.py event_detector.py event_pipeline.py
          main.py models.py node.py protocol.py server.py simulator.py stream_manager.py

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q
